server {
    listen 80;
    server_name agenda.culturasabauda.eu;
    # Ajouter certbot SSL avant mise en production publique

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Note migration domaine dédié : changer uniquement server_name.
# La variable DOMAIN dans .env est documentaire uniquement.
