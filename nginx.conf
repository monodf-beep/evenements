# ═══════════════════════════════════════════════════════════════════════════════
#  CE FICHIER NE TOURNE PAS. Il n'est PAS la configuration du VPS.
#
#  Ce qui sert en production, c'est TRAEFIK (HTTPS Let's Encrypt), par deux
#  routes versionnées dans deploy/ :
#      deploy/traefik-backoffice.yml → backoffice.agendasabauda.eu → 127.0.0.1:8098
#      deploy/traefik-agenda.yml     → agenda.culturasabauda.eu    → 127.0.0.1:8098
#  Détail d'installation : docs/DEPLOIEMENT_HOSTINGER.md.
#
#  Ce fichier-ci n'existe que comme REPLI, si l'hébergement changeait pour une
#  machine à nginx. Il ne doit pas être déployé sans être relu.
#
#  CORRIGÉ LE 2026-09-22, et l'anecdote vaut la correction. Il annonçait encore
#  « agenda.culturasabauda.eu » et le port 5001, alors que le service écoute sur
#  8098 depuis longtemps. Personne ne s'en servait, donc personne ne l'avait vu.
#  Et il a coûté une demi-heure ce jour-là : je cherchais le journal d'accès du
#  back-office dans /etc/nginx/sites-enabled/, qui est vide — puisqu'il n'y a pas
#  de nginx sur ce serveur. L'en-tête de ce fichier le disait DÉJÀ, en première
#  ligne. Je l'avais ouvert avec un grep sur « server_name|listen|proxy_pass »,
#  qui sautait justement le commentaire. C'est la racine du CLAUDE.md, servie une
#  fois de plus : conclure sur un indice de surface au lieu d'aller LIRE la chose.
#
#  D'où la forme de cet en-tête : ce qu'il faut savoir est écrit en clair, en
#  tête, et pas seulement dans les directives.
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    # Les deux noms servent la MÊME application (même service, même port).
    server_name backoffice.agendasabauda.eu agenda.culturasabauda.eu;

    # HTTPS : à confier à certbot avant toute mise en ligne publique.
    # Sans certificat, ce vhost ne doit pas être exposé — le back-office
    # transmet un mot de passe.

    location / {
        # Le service gunicorn écoute ici (cf. deploy/agenda-admin.service).
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Certaines pages (audits, lots) dépassent largement la minute : le
        # service systemd est lui-même réglé sur --timeout 180.
        proxy_read_timeout 180s;
    }
}
