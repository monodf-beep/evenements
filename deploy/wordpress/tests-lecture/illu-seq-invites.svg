<!-- Séquence de l'encart agenda (02/10), en boucle comme un GIF : 1. l'agenda se coche,
     2. la fiche du rendez-vous s'ouvre et les invités s'y ajoutent un à un. C'est le vrai
     geste : on invite DEPUIS son agenda, qui envoie l'invitation (Franck : « on ajoute à
     son agenda et dans son agenda on invite quelqu'un »). Fixe si moins d'animations. -->
<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
<style>
path,circle{fill:none;stroke:#1D1D1B;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.c{stroke:#DC5D45}
.A{animation:sA 9s infinite}.B{opacity:0;animation:sB 9s infinite}
.ta{stroke-dasharray:1;stroke-dashoffset:1;animation:dA 9s infinite}
.ca{stroke-dasharray:1;stroke-dashoffset:1;animation:cA 9s infinite}
.tb{stroke-dasharray:1;stroke-dashoffset:1;animation:dB 9s infinite}
.p1,.p2,.p3{opacity:0;transform-box:fill-box;transform-origin:center}
.p1{animation:p1 9s infinite}.p2{animation:p2 9s infinite}.p3{animation:p3 9s infinite}
@keyframes sA{0%,40%{opacity:1}45%,100%{opacity:0}}
@keyframes sB{0%,43%{opacity:0}48%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes dA{0%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
@keyframes cA{0%,15%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
@keyframes dB{0%,45%{stroke-dashoffset:1}58%,100%{stroke-dashoffset:0}}
@keyframes p1{0%,60%{opacity:0;transform:scale(.4)}65%,100%{opacity:1;transform:scale(1)}}
@keyframes p2{0%,68%{opacity:0;transform:scale(.4)}73%,100%{opacity:1;transform:scale(1)}}
@keyframes p3{0%,76%{opacity:0;transform:scale(.4)}81%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.A{display:none}.B,.p1,.p2,.p3{opacity:1;animation:none}.tb{animation:none;stroke-dashoffset:0}}
</style>
<g class="A" transform="translate(55 0)">
<path class="ta" pathLength="1" d="M21 31 C19 52 21 79 23 101 C46 99 70 100 92 98 C91 76 92 51 90 29 C67 31 44 30 21 31Z"/>
<path class="ta" pathLength="1" d="M21 45 C45 43 68 44 91 42 M38 21 C38 26 39 31 38 36 M73 20 C72 25 73 30 73 35"/>
<path class="c ca" pathLength="1" d="M40 71 C44 75 48 80 52 84 C60 75 68 67 77 59"/>
</g>
<g class="B">
<path class="tb" pathLength="1" d="M28 14 C78 12 128 13 172 15 C174 43 174 75 172 106 C122 108 74 108 28 106 C26 76 26 44 28 14Z"/>
<path class="tb c" pathLength="1" d="M42 30 C70 29 98 30 124 29"/>
<path class="tb" pathLength="1" d="M42 44 C58 43 74 44 90 43 M28 58 C78 57 128 57 172 58"/>
<g class="p1"><circle cx="54" cy="82" r="12"/><circle cx="54" cy="78" r="4" style="stroke-width:2.6"/><path style="stroke-width:2.6" d="M46 91 C48 85 60 85 62 91"/></g>
<g class="p2"><circle cx="84" cy="82" r="12"/><circle cx="84" cy="78" r="4" style="stroke-width:2.6"/><path style="stroke-width:2.6" d="M76 91 C78 85 90 85 92 91"/></g>
<g class="p3"><circle cx="114" cy="82" r="12" class="c"/><path class="c" d="M114 76 C114 80 114 84 114 88 M108 82 C112 82 116 82 120 82"/></g>
</g>
</svg>
