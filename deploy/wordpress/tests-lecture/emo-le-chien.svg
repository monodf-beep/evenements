<!-- Le chien — rigolo : une patte surgit du bas, tamponne la date d’une empreinte, puis le chien pointe le bout du nez.
     Style des icônes de l’accueil et de illu-agenda.svg. Se dessine, puis un seul
     mouvement joué deux fois, puis image fixe (WCAG 2.2.2). Servie en <img>. -->
<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
<style>
path,circle{fill:none;stroke:#1D1D1B;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.c{stroke:#DC5D45}.cf{stroke:#DC5D45;fill:#F6DDD5}.cp{fill:#DC5D45;stroke:none}
.t{stroke-dasharray:1;stroke-dashoffset:1;animation:trace .8s ease-out both}
.d1{animation-delay:.1s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}.d4{animation-delay:1.3s}
.d5{animation-delay:1.7s}.d6{animation-delay:2.1s}.d7{animation-delay:2.5s}.d8{animation-delay:2.9s}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes trace{0%{opacity:0;stroke-dashoffset:1}2%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes bat{50%{transform:scale(1.18)}}
.patte{transform:translate(90px,90px);animation:tampon 2s ease-in-out 1.1s forwards}@keyframes tampon{0%{transform:translate(90px,90px)}38%{transform:translate(0,0)}46%{transform:translate(-2px,2px)}54%{transform:translate(0,0)}100%{transform:translate(90px,90px)}}.emp{opacity:0;animation:vu .2s linear 2.1s forwards}@keyframes vu{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.t{animation:none!important;stroke-dashoffset:0}.pop{animation:none!important;opacity:1}.patte{animation:none!important;transform:translate(90px,90px)}.emp{animation:none!important;opacity:1}}
</style>
<g transform="translate(14 0)"><path class="t d1" pathLength="1" d="M21 31 C19 52 21 79 23 101 C46 99 70 100 92 98 C91 76 92 51 90 29 C67 31 44 30 21 31Z"/><path class="t d2" pathLength="1" d="M21 45 C45 43 68 44 91 42 M38 21 C38 26 39 31 38 36 M73 20 C72 25 73 30 73 35"/><g class="emp"><path class="cf" d="M54 76 C50 76 46 80 47 84 C48 88 54 88 57 88 C61 88 66 88 66 84 C67 80 62 76 58 76Z"/><path class="cf" d="M45 71 C44 68 48 67 49 70 C50 73 46 74 45 71Z M51 66 C51 63 55 63 55 66 C55 69 51 69 51 66Z M59 66 C59 63 63 63 63 66 C63 69 59 69 59 66Z M65 71 C66 68 70 68 69 71 C68 74 64 74 65 71Z" style="stroke-width:2"/></g></g><g class="patte"><path d="M68 94 C88 104 104 112 122 122 M80 78 C100 88 120 98 140 108"/><path d="M60 80 C56 86 58 94 66 96 C72 98 80 96 84 92 C88 86 86 78 80 76 C74 74 64 75 60 80Z" style="fill:#FBF7F0"/><path d="M52 72 C50 68 55 66 57 69 C58 72 54 74 52 72Z M59 65 C59 61 64 61 64 65 C64 69 59 69 59 65Z M68 64 C68 60 73 60 73 64 C73 68 68 68 68 64Z M76 68 C77 64 82 65 81 69 C80 72 75 72 76 68Z" style="fill:#FBF7F0;stroke-width:2.6"/></g><g class="pop" style="animation-delay:3.2s"><path d="M160 74 C170 73 178 80 178 90 C178 100 170 106 160 106 C150 106 142 100 142 90 C142 80 150 74 160 74Z"/><path d="M146 80 C138 78 132 86 134 98 C140 100 144 94 145 88 M174 80 C182 78 188 86 186 98 C180 100 176 94 175 88"/><path d="M156 92 C158 90 162 90 164 92 C163 95 157 95 156 92Z" style="fill:#1D1D1B;stroke-width:2"/></g>
</svg>
