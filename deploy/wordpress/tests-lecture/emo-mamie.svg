<!-- Mamie — chouchou : chignon et lunettes, le téléphone vibre, la date s’affiche, elle répond d’un cœur.
     Style des icônes de l’accueil et de illu-agenda.svg. Se dessine, puis un seul
     mouvement joué deux fois, puis image fixe (WCAG 2.2.2). Servie en <img>. -->
<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
<style>
path,circle{fill:none;stroke:#1D1D1B;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.c{stroke:#DC5D45}.cf{stroke:#DC5D45;fill:#F6DDD5}.cp{fill:#DC5D45;stroke:none}
.t{stroke-dasharray:1;stroke-dashoffset:1;animation:trace .8s ease-out both}
.d1{animation-delay:.1s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}.d4{animation-delay:1.3s}
.d5{animation-delay:1.7s}.d6{animation-delay:2.1s}.d7{animation-delay:2.5s}.d8{animation-delay:2.9s}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes trace{0%{opacity:0;stroke-dashoffset:1}2%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes bat{50%{transform:scale(1.18)}}
.tel{transform-box:fill-box;transform-origin:center bottom;animation:vib .5s ease-in-out 1.7s 2}@keyframes vib{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}.ondes{opacity:0;animation:ondes 1s ease-out 1.7s 2}@keyframes ondes{20%,70%{opacity:1}100%{opacity:0}}.monte{opacity:0;animation:monte 1.4s ease-out forwards}@keyframes monte{0%{opacity:0;transform:translate(-6px,14px) scale(.4)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.t{animation:none!important;stroke-dashoffset:0}.pop{animation:none!important;opacity:1}.tel{animation:none!important}.ondes{animation:none!important}.monte{animation:none!important;opacity:1}}
</style>
<path class="t d1" pathLength="1" d="M52 34 C61 34 67 41 66 50 C65 59 58 63 51 62 C43 61 38 54 39 47 C40 40 45 34 52 34Z"/><path class="t d1" pathLength="1" d="M52 34 C47 33 46 27 50 25 C54 23 58 27 56 31 C55 33 54 34 52 34"/><path class="t d2" pathLength="1" d="M44 48 C44 44 50 44 50 48 C50 52 44 52 44 48Z M55 48 C55 44 61 44 61 48 C61 52 55 52 55 48Z M50 48 C51.5 47 53.5 47 55 48" style="stroke-width:2.4"/><path class="t d2" pathLength="1" d="M22 114 C24 92 36 80 52 80 C68 80 80 92 82 114"/><g class="tel"><path class="t d3" pathLength="1" d="M116 30 C124 29 134 29 142 30 C143 50 143 70 142 90 C134 91 124 91 116 90 C115 70 115 50 116 30Z M124 84 C127 84 131 84 134 84"/><path class="t d4" pathLength="1" d="M121 44 C126 43 132 43 137 44 C137 52 137 60 137 68 C132 69 126 69 121 68 C121 60 121 52 121 44Z M121 51 C126 50 132 50 137 51" style="stroke-width:2.4"/><path class="cf pop" style="animation-delay:2.2s" d="M129.0 58.2 C126.8 55.0 122.7 56.4 123.6 59.5 C124.5 62.2 129.0 64.0 129.0 64.0 C129.0 64.0 133.5 62.2 134.4 59.5 C135.3 56.4 131.2 55.0 129.0 58.2Z"/></g><path class="ondes" d="M106 46 C102 54 102 64 106 72 M152 46 C156 54 156 64 152 72" style="stroke-width:2.6"/><g class="pop" style="animation-delay:2.8s"><path d="M156 8 C166 7 178 7 188 8 C189 15 189 23 188 30 C180 31 172 31 166 31 L159 37 L161 31 C159 31 157 31 156 30 C155 23 155 15 156 8Z"/><path class="cf"  d="M172.0 17.8 C169.2 13.9 164.3 15.6 165.4 19.4 C166.5 22.8 172.0 24.9 172.0 24.9 C172.0 24.9 177.5 22.8 178.6 19.4 C179.7 15.6 174.8 13.9 172.0 17.8Z"/></g><path class="cf monte" style="animation-delay:3.3s" d="M92.0 24.4 C90.0 21.6 86.4 22.8 87.2 25.6 C88.0 28.0 92.0 29.6 92.0 29.6 C92.0 29.6 96.0 28.0 96.8 25.6 C97.6 22.8 94.0 21.6 92.0 24.4Z"/><path class="cf monte" style="animation-delay:3.6s" d="M82.0 10.8 C80.5 8.7 77.8 9.6 78.4 11.7 C79.0 13.5 82.0 14.7 82.0 14.7 C82.0 14.7 85.0 13.5 85.6 11.7 C86.2 9.6 83.5 8.7 82.0 10.8Z"/>
</svg>
