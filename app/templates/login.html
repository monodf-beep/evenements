<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Agenda Cultura Sabauda</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  body { display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .login { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:2rem 2.2rem; width:340px; box-shadow:0 10px 30px rgba(16,24,40,.10); }
  .login .brand { padding:0 0 1.2rem; }
  .login label { display:block; font-size:.85rem; color:#374151; margin:.8rem 0 .25rem; }
  .login input { width:100%; padding:.6rem .7rem; border:1px solid #d1d5db; border-radius:8px; font-size:.95rem; }
  .login button { width:100%; margin-top:1.4rem; }
</style>
</head>
<body>
<form class="login" method="POST" action="{{ url_for('login', next=request.args.get('next','')) }}">
  <div class="brand">
    <span class="brand-mark">CS</span>
    <div><b style="color:var(--ink)">Cultura Sabauda</b><small>Backoffice Agenda</small></div>
  </div>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <label for="username">Nom d'utilisateur</label>
  <input id="username" name="username" autocomplete="username" autofocus>
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit" class="btn btn-primary">Se connecter</button>
</form>
</body>
</html>
